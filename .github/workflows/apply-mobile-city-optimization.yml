name: Apply mobile city optimization

on:
  push:
    paths:
      - 'scripts/apply-mobile-city-optimization.mjs'
      - '.github/workflows/apply-mobile-city-optimization.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - name: Apply source patches
        run: node scripts/apply-mobile-city-optimization.mjs
      - name: Install dependencies
        working-directory: 'GTA/Проект'
        run: npm ci
      - name: Test
        working-directory: 'GTA/Проект'
        run: npm test
      - name: Build
        working-directory: 'GTA/Проект'
        run: npm run build
      - name: Validate diff
        run: git diff --check
      - name: Commit optimized source
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'GTA/Проект/src/render/GameRenderer.ts' 'GTA/Проект/src/game/simulation.ts' 'GTA/Проект/src/game/ai.ts' 'GTA/Проект/src/ui/App.tsx'
          git commit -m 'Optimize mobile performance and increase city activity'
          git push origin HEAD:main
