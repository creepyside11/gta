name: Import CC0 environment assets

on:
  push:
    branches: ['feat/vice-city-scale-map']
    paths:
      - '.github/workflows/import-environment-assets.yml'

permissions:
  contents: write

concurrency:
  group: environment-assets
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate curated CC0 GLB assets
        run: bash .github/scripts/import_environment_assets.sh
      - name: Commit imported assets and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'GTA/Проект/public/models/environment'
          git commit -m 'Import curated CC0 city and nature models'
          git push origin HEAD:${GITHUB_REF_NAME}
