name: Metro focused validation

on:
  push:
    branches: [feat/vice-city-scale-map]
    paths:
      - 'GTA/Проект/**'
      - '.github/workflows/metro-fast-ci.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - run: npm ci --prefix 'GTA/Проект'
      - name: Escape scenario
        working-directory: 'GTA/Проект'
        run: node --import tsx --test --test-name-pattern='one continuous session' tests/simulation.test.ts
      - name: Metro streetscape
        working-directory: 'GTA/Проект'
        run: node --import tsx --test --test-name-pattern='legacy avenues retain furniture' tests/street-furniture.test.ts
      - name: Regional police response
        working-directory: 'GTA/Проект'
        run: node --import tsx --test --test-name-pattern='police can dispatch' tests/world-traffic.test.ts
      - name: Production build
        run: npm run build --prefix 'GTA/Проект'
