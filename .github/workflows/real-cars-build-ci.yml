name: Real cars TypeScript build

on:
  push:
    branches: [feat/real-cars-bmw-g63-gtr]
    paths:
      - 'GTA/Проект/**'
      - '.github/workflows/real-cars-build-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - run: npm ci --prefix 'GTA/Проект'
      - run: npm run build --prefix 'GTA/Проект'
