name: Build metro Android APK

on:
  workflow_dispatch:
  push:
    branches: ['feat/vice-city-scale-map']
    paths:
      - 'android/**'
      - 'GTA/Проект/**'
      - '.github/workflows/build-metro-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-metro
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install game dependencies
        run: npm ci --prefix 'GTA/Проект'
      - name: Build offline game assets
        run: npm run build --prefix 'GTA/Проект'
      - name: Build installable debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify and stage APK
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk-delivery"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk-delivery/portside-metro-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/apk-delivery/portside-metro-debug.apk"
          python - <<'PY'
          import os, zipfile, json, hashlib
          from pathlib import Path
          delivery = Path(os.environ['RUNNER_TEMP']) / 'apk-delivery'
          apk = delivery / 'portside-metro-debug.apk'
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert 'classes.dex' in names
              assert 'assets/index.html' in names
              assert any(p.startswith('assets/assets/') and p.endswith('.js') for p in names)
              required = [
                  'assets/models/environment/house-a.glb',
                  'assets/models/environment/house-b.glb',
                  'assets/models/environment/house-h.glb',
                  'assets/models/environment/house-i.glb',
                  'assets/models/environment/tree-oak.glb',
                  'assets/models/environment/tree-palm.glb',
                  'assets/models/environment/tree-pine.glb',
                  'assets/models/environment/Textures/colormap.png',
              ]
              missing = [p for p in required if p not in names]
              assert not missing, f'missing environment assets in APK: {missing}'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (delivery / 'portside-metro-debug.apk.sha256').write_text(digest + '  portside-metro-debug.apk\n')
          (delivery / 'metro-build-info.json').write_text(json.dumps({
              'sourceCommit': os.environ['SOURCE_COMMIT'],
              'workflowRun': os.environ['GITHUB_RUN_ID'],
              'sha256': digest,
              'bytes': apk.stat().st_size,
              'package': 'com.creepyside11.portside.debug',
              'minimumAndroid': '8.0',
              'buildType': 'debug',
              'offline': True,
              'map': 'five-city metro',
              'environment': 'water + beaches + CC0 houses and trees'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portside-metro-android-apk
          path: ${{ runner.temp }}/apk-delivery/
          retention-days: 30
      - name: Publish APK on feature branch
        run: |
          mkdir -p apk
          cp "$RUNNER_TEMP/apk-delivery/portside-metro-debug.apk" apk/portside-metro-debug.apk
          cp "$RUNNER_TEMP/apk-delivery/portside-metro-debug.apk.sha256" apk/portside-metro-debug.apk.sha256
          cp "$RUNNER_TEMP/apk-delivery/metro-build-info.json" apk/metro-build-info.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/portside-metro-debug.apk apk/portside-metro-debug.apk.sha256 apk/metro-build-info.json
          git commit -m 'Publish metro Android APK [skip ci]' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
