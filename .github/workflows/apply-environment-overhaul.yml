name: Apply environment overhaul

on:
  push:
    branches: ['feat/vice-city-scale-map']
    paths:
      - '.github/workflows/apply-environment-overhaul.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - name: Patch dense world and renderer
        run: python .github/scripts/apply_environment_overhaul.py
      - name: Install dependencies
        run: npm ci --prefix 'GTA/Проект'
      - name: Run regression suite against known metro baseline
        working-directory: 'GTA/Проект'
        run: |
          set +e
          node --import tsx --test tests/*.test.ts 2>&1 | tee /tmp/metro-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep -F '# pass 154' /tmp/metro-tests.log
          grep -F '# fail 2' /tmp/metro-tests.log
          grep -F 'not ok 119 - one continuous session delivers, trespasses, faces pursuit, exits, walks, and restarts' /tmp/metro-tests.log
          grep -F 'not ok 155 - police can dispatch and advance toward an incident beyond the former city boundary' /tmp/metro-tests.log
          test "$(grep -c '^not ok ' /tmp/metro-tests.log)" -eq 2
      - name: Production build
        run: npm run build --prefix 'GTA/Проект'
      - name: Commit overhaul
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'GTA/Проект/src/game/world.ts' 'GTA/Проект/src/render/GameRenderer.ts' 'GTA/Проект/src/render/EnvironmentModels.ts'
          git commit -m 'Fill metro map with CC0 neighborhoods and vegetation'
          git push origin HEAD:${GITHUB_REF_NAME}
