name: Retry water and city life upgrade

on:
  push:
    paths:
      - 'scripts/fix-water-player-type.mjs'
      - '.github/workflows/retry-water-life-quality.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'GTA/Проект/package-lock.json'
      - name: Apply upgrade
        run: |
          node scripts/apply-water-life-quality.mjs
          node scripts/fix-water-player-type.mjs
      - name: Install dependencies
        working-directory: 'GTA/Проект'
        run: npm ci
      - name: Test
        working-directory: 'GTA/Проект'
        run: npm test
      - name: Build
        working-directory: 'GTA/Проект'
        run: npm run build
      - name: Validate diff
        run: git -c core.whitespace=-cr-at-eol diff --check
      - name: Commit upgraded game
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'GTA/Проект/src/game/types.ts' 'GTA/Проект/src/game/simulation.ts' 'GTA/Проект/src/render/GameRenderer.ts' 'GTA/Проект/src/render/WaterWorld.ts' 'GTA/Проект/tests/swimming.test.ts'
          git commit -m 'Add swimmable water boats crowds and restore mobile quality'
          git push origin HEAD:main
